name: Create PR development → main

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  create-pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'desarrollo_code'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head desarrollo_code \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          echo "PRs abiertos encontrados: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head desarrollo_code \
            --title "Merge desarrollo_code → main" \
            --body "$(cat <<'EOF'
          ## Pull Request automático

          Este Pull Request ha sido creado automáticamente después de que la rama `desarrollo_code` haya superado correctamente el workflow de CI.

          ### Validaciones realizadas

          - ✅ Lint
          - ✅ Tests
          - ✅ Build

          La generación de la imagen Docker y su publicación en GHCR se realizará únicamente después del merge en `main`.

          ### Despliegue

          Una vez realizado el merge:

          1. Se ejecutará nuevamente el CI sobre `main`.
          2. Se construirá la imagen Docker.
          3. Se publicarán las etiquetas `latest` y `sha-*` en GHCR.
          4. Watchtower detectará la nueva imagen.
          5. El contenedor `h3-oraculo` del QNAP será actualizado automáticamente.
          EOF
          )"

      - name: PR already exists
        if: steps.check-pr.outputs.exists == 'true'
        run: |
          echo "Ya existe un Pull Request abierto de desarrollo_code hacia main."
          echo "No se crea uno nuevo."