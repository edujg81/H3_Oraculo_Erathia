name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  create-pr:
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$HEAD_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          echo "Rama: $HEAD_BRANCH"
          echo "PRs abiertos encontrados: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "Merge $HEAD_BRANCH → main" \
            --body "$(cat <<'EOF'
          ## Pull Request automático

          Este Pull Request ha sido creado automáticamente después de superar correctamente el CI de la rama.

          ### Validaciones

          - ✅ Lint
          - ✅ Tests
          - ✅ Build

          La imagen Docker se genera únicamente después de crear una nueva release en `main`.

          ### Release

          Al hacer merge en `main`:

          1. Se ejecutará el CI.
          2. Semantic Release determinará la nueva versión.
          3. Se actualizarán `package.json`, `package-lock.json` y `CHANGELOG.md`.
          4. Se creará el tag correspondiente.
          5. Se creará la GitHub Release.
          6. Se construirá la imagen Docker.
          7. La imagen se publicará en GHCR.
          8. Watchtower detectará la nueva imagen.
          9. El QNAP actualizará automáticamente `h3-oraculo`.
          EOF
          )"

      - name: PR already exists
        if: steps.check-pr.outputs.exists == 'true'
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Ya existe un Pull Request abierto de $HEAD_BRANCH hacia main."

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BEFORE=$(git tag --sort=-v:refname | head -n 1)

          echo "Último tag antes de Semantic Release: $BEFORE"

          npm run release

          git fetch --tags

          AFTER=$(git tag --sort=-v:refname | head -n 1)

          echo "Último tag después de Semantic Release: $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$AFTER" >> "$GITHUB_OUTPUT"
            echo "Nueva release detectada: $AFTER"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No se ha creado ninguna release."
          fi

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
