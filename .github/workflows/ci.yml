name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  create-pr:
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$HEAD_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          echo "Rama: $HEAD_BRANCH"
          echo "PRs abiertos encontrados: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "Merge $HEAD_BRANCH → main" \
            --body "$(cat <<'EOF'
          ## Pull Request automático

          Este Pull Request ha sido creado automáticamente después de superar correctamente el CI de la rama.

          ### Validaciones

          - ✅ Lint
          - ✅ Tests
          - ✅ Build

          La imagen Docker se genera únicamente después de crear una nueva release en `main`.

          ### Release

          Al hacer merge en `main`:

          1. Se ejecutará el CI.
          2. Semantic Release determinará la nueva versión.
          3. Se actualizarán `package.json`, `package-lock.json` y `CHANGELOG.md`.
          4. Se creará el tag correspondiente.
          5. Se creará la GitHub Release.
          6. El tag disparará la construcción de Docker.
          7. La imagen se publicará en GHCR.
          8. Watchtower detectará la nueva imagen.
          9. El QNAP actualizará automáticamente `h3-oraculo`.
          EOF
          )"

      - name: PR already exists
        if: steps.check-pr.outputs.exists == 'true'
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Ya existe un Pull Request abierto de $HEAD_BRANCH hacia main."

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release